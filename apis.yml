name: venusmedtech
description: >-
  Venus Medtech (Hangzhou) Inc. is a China-based innovator in transcatheter
  structural heart valve therapies, founded in 2009 and headquartered in
  Hangzhou. Listed on the Hong Kong Stock Exchange (2500.HK), it pioneered
  first-in-China TAVR and TPVR solutions and covers TAVR, TPVR, TMVR and TTVR
  heart valve intervention devices, including the commercialized VenusA-Valve,
  VenusA-Plus, VenusA-Pro, VenusA-Deluxe and the VenusP-Valve TPVR system. It is
  a physical medical-device manufacturer that publishes a corporate/product
  marketing site and an eIFU (electronic Instructions for Use) portal, and has
  no public developer API surface. Surfaced as a portfolio company of qiming and
  added to the API Evangelist network as a stub for enrichment.
